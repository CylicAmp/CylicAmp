<title>GF(37) Unified 8-Sector Operator Framework</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0b0f19;
  color: #c0bcb0;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  gap: 0.75rem;
  user-select: none;
}

.eyebrow {
  font-family: ui-monospace, 'Cascadia Code', 'Courier New', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: #38405a;
}

.stage { border: 1px solid #14192a; line-height: 0; position: relative; }
canvas { display: block; cursor: grab; touch-action: none; }
canvas:active { cursor: grabbing; }

/* GF label overlay */
.gf-badge {
  position: absolute;
  top: 7px; right: 9px;
  font-family: ui-monospace, monospace;
  font-size: 0.54rem;
  letter-spacing: 0.14em;
  color: #28406a;
  line-height: 1.65;
}

.controls {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  background: transparent;
  border: 1px solid #1c2234;
  color: #c0bcb0;
  padding: 0.35rem 0.8rem;
  font-family: ui-monospace, 'Courier New', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  cursor: pointer;
  transition: border-color 0.12s;
}
button:hover { border-color: #38405a; }

.sl-group {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-family: ui-monospace, monospace;
  font-size: 0.55rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #38405a;
}
input[type=range] { accent-color: #d4a843; width: 80px; }

.legend {
  display: flex;
  gap: 1.4rem;
  align-items: center;
  font-family: ui-monospace, monospace;
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  color: #38405a;
}
.leg-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 0.35rem; }
</style>

<p class="eyebrow">GF(37) Unified 8-Sector Operator Framework</p>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="gf-badge">
    mod_val = (|xi·yi| + 7) mod 37<br>
    h = 2 + (mod_val mod 5) × 0.8<br>
    inner r&lt;10 → cyan · outer → pink
  </div>
</div>

<div class="controls">
  <button id="rb">RESET VIEW</button>
  <label class="sl-group">SPIN <input type="range" id="spd" min="0" max="1.5" step="0.05" value="0.25"></label>
  <label class="sl-group">ZOOM <input type="range" id="zoom" min="0.5" max="2.4" step="0.05" value="1"></label>
</div>

<div class="legend">
  <span><span class="leg-dot" style="background:#00e5ff"></span>inner field r&lt;10</span>
  <span><span class="leg-dot" style="background:#ff3399"></span>outer field r≥10</span>
  <span><span class="leg-dot" style="background:#ff9933"></span>shell r=6</span>
  <span><span class="leg-dot" style="background:#00ffff"></span>shell r=10</span>
  <span><span class="leg-dot" style="background:#ff3366"></span>shell r=14</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = Math.min(640, window.innerWidth - 32);
const H = Math.round(W * 0.84);
canvas.width = W; canvas.height = H;
const CX = W / 2, CY = H / 2;

let rotX = -0.52, rotY = 0.88;
let autoSpeed = 0.25, zoomFactor = 1.0;
let dragging = false, lastMX = 0, lastMY = 0;

// ── Controls ─────────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  document.getElementById('spd').value = autoSpeed = 0;
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - lastMX) * 0.009;
  rotX = Math.max(-1.45, Math.min(1.45, rotX + (e.clientY - lastMY) * 0.009));
  lastMX = e.clientX; lastMY = e.clientY;
});
['mouseup','mouseleave'].forEach(ev => canvas.addEventListener(ev, () => { dragging = false; }));

canvas.addEventListener('touchstart', e => {
  dragging = true; lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
  document.getElementById('spd').value = autoSpeed = 0;
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!dragging) return; e.preventDefault();
  rotY += (e.touches[0].clientX - lastMX) * 0.009;
  rotX = Math.max(-1.45, Math.min(1.45, rotX + (e.touches[0].clientY - lastMY) * 0.009));
  lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; });

document.getElementById('rb').addEventListener('click', () => {
  rotX = -0.52; rotY = 0.88;
  document.getElementById('spd').value = autoSpeed = 0.25;
  document.getElementById('zoom').value = zoomFactor = 1.0;
});
document.getElementById('spd').addEventListener('input',  e => { autoSpeed  = +e.target.value; });
document.getElementById('zoom').addEventListener('input', e => { zoomFactor = +e.target.value; });

// ── 3D transforms ─────────────────────────────────────────────────────────────
function tr([x, y, z]) {
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const y2 = y * cosX - z * sinX;
  const z2 = y * sinX + z * cosX;
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const x3 = x * cosY + z2 * sinY;
  const z3 = -x * sinY + z2 * cosY;
  return [x3, y2, z3];
}

const PDIST = 78;
function proj([x, y, z]) {
  const d = z + PDIST;
  const s = PDIST * 13 * zoomFactor / d;
  return [CX + x * s, CY - y * s, z];
}

function hexA(hex, a) {
  return hex + Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, '0');
}

// ── GF(37) arithmetic ─────────────────────────────────────────────────────────
// mod_val = (|xi * yi| + 7) % 37
// height  = 2 + (mod_val % 5) * 0.8
function gf37Height(xi, yi) {
  const mod_val = (Math.abs(Math.round(xi) * Math.round(yi)) + 7) % 37;
  return 2 + (mod_val % 5) * 0.8;
}

// ── Grid & shell geometry (precomputed, stable each frame) ────────────────────
// linspace(-15, 15, 7) → step 5
const GCOORDS = [-15, -10, -5, 0, 5, 10, 15];
const CUBE_W  = 2.2;
const ZBASE   = -12;

const BARS = [];
GCOORDS.forEach(bx => {
  GCOORDS.forEach(by => {
    const r_dist = Math.sqrt(bx * bx + by * by);
    const dz     = gf37Height(bx, by);
    const col    = r_dist < 10 ? '#00e5ff' : '#ff3399';
    const inner  = r_dist < 10;
    BARS.push({ bx, by, dz, col, inner });
  });
});

// ── Scene builder ─────────────────────────────────────────────────────────────
function buildScene() {
  const items = [];

  function seg(p1, p2, color, alpha, lw) {
    const tp1 = tr(p1), tp2 = tr(p2);
    const depth = (tp1[2] + tp2[2]) / 2;
    const pp1 = proj(tp1), pp2 = proj(tp2);
    items.push({ depth, draw() {
      ctx.beginPath();
      ctx.moveTo(pp1[0], pp1[1]);
      ctx.lineTo(pp2[0], pp2[1]);
      ctx.strokeStyle = hexA(color, alpha);
      ctx.lineWidth = lw;
      ctx.stroke();
    }});
  }

  function poly(pts, fill, fa, stroke, sa, lw) {
    const pp = pts.map(p => proj(tr(p)));
    const depth = pp.reduce((s, p) => s + p[2], 0) / pp.length;
    items.push({ depth, draw() {
      ctx.beginPath();
      ctx.moveTo(pp[0][0], pp[0][1]);
      for (let i = 1; i < pp.length; i++) ctx.lineTo(pp[i][0], pp[i][1]);
      ctx.closePath();
      if (fa > 0) { ctx.fillStyle = hexA(fill, fa);   ctx.fill(); }
      if (sa > 0 && lw > 0) { ctx.strokeStyle = hexA(stroke, sa); ctx.lineWidth = lw; ctx.stroke(); }
    }});
  }

  // ── 1. Coordinate axes ─────────────────────────────────────────────────────
  const AX = 20;
  seg([0,0,0],[AX,0,0],  '#ff3333', 0.80, 2.0);
  seg([0,0,0],[0,AX,0],  '#00ff66', 0.80, 2.0);
  seg([0,0,0],[0,0,AX],  '#3399ff', 0.80, 2.0);
  seg([0,0,0],[-AX,0,0], '#ff3333', 0.25, 0.7);
  seg([0,0,0],[0,-AX,0], '#00ff66', 0.25, 0.7);
  seg([0,0,0],[0,0,-AX], '#3399ff', 0.25, 0.7);

  // ── 2. Cylindrical residue shells z ∈ [−8, 8] ────────────────────────────
  const RADII  = [6, 10, 14];
  const SCOLS  = ['#ff9933', '#00ffff', '#ff3366'];
  const SZ0 = -8, SZ1 = 8, NTHETA = 36, NSTRIPES = 12;

  RADII.forEach((r, ri) => {
    const col = SCOLS[ri];
    [SZ0, 0, SZ1].forEach(zl => {
      for (let ti = 0; ti < NTHETA; ti++) {
        const a1 = ti * 2 * Math.PI / NTHETA;
        const a2 = (ti + 1) * 2 * Math.PI / NTHETA;
        seg([r*Math.cos(a1), r*Math.sin(a1), zl],
            [r*Math.cos(a2), r*Math.sin(a2), zl], col, 0.45, 0.65);
      }
    });
    for (let si = 0; si < NSTRIPES; si++) {
      const a = si * 2 * Math.PI / NSTRIPES;
      seg([r*Math.cos(a), r*Math.sin(a), SZ0],
          [r*Math.cos(a), r*Math.sin(a), SZ1], col, 0.22, 0.5);
    }
    for (let si = 0; si < NSTRIPES; si++) {
      const a1 = si * 2 * Math.PI / NSTRIPES;
      const a2 = (si + 1) * 2 * Math.PI / NSTRIPES;
      poly([
        [r*Math.cos(a1), r*Math.sin(a1), SZ0],
        [r*Math.cos(a2), r*Math.sin(a2), SZ0],
        [r*Math.cos(a2), r*Math.sin(a2), SZ1],
        [r*Math.cos(a1), r*Math.sin(a1), SZ1],
      ], col, 0.07, col, 0, 0);
    }
  });

  // ── 3. 8-Sector rays ──────────────────────────────────────────────────────
  const TOP_Z = 18, INNER_Z = 6, OUTER_R = 18;
  for (let si = 0; si < 8; si++) {
    const a  = si * Math.PI / 4;
    const xo = OUTER_R * Math.cos(a), yo = OUTER_R * Math.sin(a);
    seg([xo, yo, TOP_Z], [0, 0, INNER_Z],       '#ffaa33', 0.60, 0.85);
    seg([xo, yo, TOP_Z], [xo*0.3, yo*0.3, -14], '#ff5533', 0.25, 0.5);
  }

  // ── 4. GF(37)-driven 3D cube bars ────────────────────────────────────────
  BARS.forEach(({ bx, by, dz, col }) => {
    const hw = CUBE_W / 2;
    const x0 = bx - hw, x1 = bx + hw;
    const y0 = by - hw, y1 = by + hw;
    const z0 = ZBASE,   z1 = ZBASE + dz;

    // Alpha varies by field region
    const fInner = Math.sqrt(bx*bx + by*by) < 10;
    const fa = fInner ? 0.60 : 0.50;

    // Top
    poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], col, fa,       col, 0.85, 0.55);
    // Front
    poly([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]], col, fa*0.50,  col, 0.45, 0.35);
    // Right
    poly([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]], col, fa*0.50,  col, 0.45, 0.35);
    // Left
    poly([[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]], col, fa*0.30,  col, 0.28, 0.28);
    // Back
    poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], col, fa*0.30,  col, 0.28, 0.28);
  });

  items.sort((a, b) => a.depth - b.depth);
  return items;
}

// ── Axis + GF(37) annotations ─────────────────────────────────────────────────
function drawLabels() {
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [
    { p: [22,0,0],  l: 'X', c: '#ff3333' },
    { p: [0,22,0],  l: 'Y', c: '#00ff66' },
    { p: [0,0,22],  l: 'Z', c: '#3399ff' },
  ].forEach(al => {
    const pp = proj(tr(al.p));
    ctx.fillStyle = al.c + 'cc';
    ctx.fillText(al.l, pp[0], pp[1]);
  });

  // Corner annotation
  ctx.font = '6.5px system-ui';
  ctx.fillStyle = '#222c40';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('drag to rotate · sliders: spin & zoom', 6, H - 6);
}

// ── Animation ─────────────────────────────────────────────────────────────────
let last = null;
function tick(ts) {
  if (!last) last = ts;
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;

  if (!dragging && autoSpeed > 0) rotY += autoSpeed * dt * 0.45;

  ctx.fillStyle = '#0b0f19';
  ctx.fillRect(0, 0, W, H);

  buildScene().forEach(it => it.draw());
  drawLabels();
  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
