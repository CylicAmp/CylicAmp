[package]
name = "kev-integrator"
version = "2.0.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
rusqlite = { version = "0.30", features = ["bundled"] }
thiserror = "1.0"
tracing = "0.1"
