<title>Recursive Rotor · GF(37)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Deliberate single-theme: this is a dark instrument display */
body {
  background: #06080f;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  color: #b0c4d4;
}

canvas { display: block; }

/* ── HUD ─────────────────────────────────────────── */
#hud {
  position: fixed;
  top: 16px;
  right: 18px;
  font-size: 10px;
  line-height: 2.3;
  letter-spacing: 0.07em;
  text-align: right;
  pointer-events: none;
  user-select: none;
}
.hud-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
.hud-key { color: #2e4a5a; text-transform: uppercase; font-size: 9px; letter-spacing: 0.14em; }
.hud-val { color: #b0c4d4; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.hud-val.accent { color: #4ab0e0; }

/* ── Controls ────────────────────────────────────── */
#ctrl {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 8px 18px;
  background: rgba(6, 8, 15, 0.9);
  border: 1px solid #1a2e3a;
  border-radius: 3px;
  white-space: nowrap;
}

.cg { display: flex; align-items: center; gap: 8px; }
.clbl {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #2e4a5a;
}
.cval {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: #4ab0e0;
  min-width: 26px;
}

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 68px;
  height: 2px;
  background: #1a2e3a;
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #4ab0e0;
  cursor: pointer;
}

.div { width: 1px; height: 18px; background: #1a2e3a; flex-shrink: 0; }

button {
  background: none;
  border: 1px solid #1a2e3a;
  color: #2e4a5a;
  padding: 3px 10px;
  border-radius: 2px;
  cursor: pointer;
  font: 9px/1 'Courier New', Courier, monospace;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: color 0.12s, border-color 0.12s;
}
button:hover { color: #4ab0e0; border-color: #4ab0e0; }
button.on    { color: #4ab0e0; border-color: #2a6080; }

/* ── Formula overlay ─────────────────────────────── */
#formula {
  position: fixed;
  bottom: 70px;
  right: 18px;
  font-size: 9.5px;
  line-height: 2.0;
  letter-spacing: 0.05em;
  color: #1e3040;
  text-align: right;
  pointer-events: none;
  user-select: none;
  transition: color 0.3s;
}
#formula.lit { color: #2e4a5a; }
</style>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-row"><span class="hud-key">t</span><span class="hud-val accent" id="h-t">0.0000</span></div>
  <div class="hud-row"><span class="hud-key">cycle</span><span class="hud-val" id="h-cyc">0.0000</span></div>
  <div class="hud-row"><span class="hud-key">depth L</span><span class="hud-val" id="h-dep">5</span></div>
  <div class="hud-row"><span class="hud-key">segs</span><span class="hud-val" id="h-seg">1364</span></div>
</div>

<div id="formula">
  α_j = (j+1)·π/2 + t·Σ(iₖ−1)<br>
  X_L = 400 + Σ d₀/2ʲ · cos(α_j)<br>
  Y_L = 400 + Σ d₀/2ʲ · sin(α_j)
</div>

<div id="ctrl">
  <div class="cg">
    <span class="clbl">ω</span>
    <input type="range" id="r-spd" min="0.05" max="4" step="0.05" value="0.6">
    <span class="cval" id="v-spd">0.60</span>
  </div>
  <div class="div"></div>
  <div class="cg">
    <span class="clbl">L</span>
    <input type="range" id="r-dep" min="1" max="5" step="1" value="5">
    <span class="cval" id="v-dep">5</span>
  </div>
  <div class="div"></div>
  <button id="b-pp" class="on">PAUSE</button>
  <button id="b-rst">RESET</button>
  <button id="b-tr">TRACE</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// Animation state
let t       = 0;
let omega   = 0.6;
let maxL    = 5;
let running = true;
let tracing = false;
let prev    = null;

// Trace trail for the all-zeros arm path endpoint
const TRAIL_CAP = 1200;
let trail = [];

// Colors indexed by depth from root (0 = root/longest, 5 = leaf/shortest)
// Root arms recede into depth; leaf arms surface as bright cyan-white.
const DEPTH_COLOR = [
  'rgba(26,  61,106, 0.80)',   // 0: deep navy
  'rgba(44, 111,170, 0.82)',   // 1: ocean blue
  'rgba(61, 154,216, 0.85)',   // 2: mid cyan
  'rgba(110,196,238, 0.88)',   // 3: light cyan
  'rgba(170,220,245, 0.92)',   // 4: pale cyan
  'rgba(220,242,255, 0.95)',   // 5: near white
];
const DEPTH_WIDTH = [2.6, 1.8, 1.2, 0.8, 0.52, 0.34];

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight, 900);
  canvas.width = canvas.height = s;
}
resize();
window.addEventListener('resize', () => { resize(); trail = []; });

// Count total segments for depth L
function segCount(L) {
  return L < 1 ? 0 : Math.round(4 * (Math.pow(4, L) - 1) / 3);
}

// ── Recursive rotor (faithful Processing translation) ──────────────────────
// Rotations ACCUMULATE within the loop at each level (no save/restore per arm).
// The ctx.save/restore is only around translate+recursion, preserving
// rotation accumulation across arm iterations at each level.
function rotor(d, lvl) {
  if (d <= 9 || lvl >= maxL) return;
  const idx  = Math.min(lvl, DEPTH_COLOR.length - 1);
  const isLeaf = (d / 2 <= 9 || lvl + 1 >= maxL);
  ctx.strokeStyle = DEPTH_COLOR[idx];
  ctx.lineWidth   = DEPTH_WIDTH[idx];
  ctx.shadowColor = DEPTH_COLOR[idx];
  ctx.shadowBlur  = isLeaf ? 7 : 2;

  for (let i = 0; i < 4; i++) {
    // Cumulative: each rotate() adds to current transform, not absolute
    ctx.rotate(Math.PI / 2 + t * (i - 1));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(d, 0);
    ctx.stroke();
    ctx.save();
    ctx.translate(d, 0);
    rotor(d / 2, lvl + 1);
    ctx.restore();
  }
}

// ── Closed-form: all-zeros arm path endpoint ───────────────────────────────
// Following arm i=0 at every level, the Processing accumulation gives
// cumulative angle at level j = (j+1)·(π/2 − t).
// This matches the user's closed-form: α_j = Σ_{k=0}^{j} θ(0,t) = (j+1)(π/2−t).
function zeroEndpoint(cx, cy, d0) {
  let x = cx, y = cy;
  for (let j = 0; j < maxL; j++) {
    const d   = d0 / Math.pow(2, j);
    const ang = (j + 1) * (Math.PI / 2 - t);
    x += d * Math.cos(ang);
    y += d * Math.sin(ang);
  }
  return [x, y];
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!prev) prev = now;
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  if (running) t += dt * omega;

  const S  = canvas.width;
  const cx = S / 2;
  const cy = S / 2;
  const d0 = 200 * (S / 800);

  // ── Background ──────────────────────────────────────────────────────────
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, S, S);

  // Ambient centre glow
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.42);
  grd.addColorStop(0, 'rgba(18, 50, 90, 0.10)');
  grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, S, S);

  // Crosshair
  ctx.strokeStyle = 'rgba(74, 176, 224, 0.05)';
  ctx.lineWidth   = 1;
  ctx.shadowBlur  = 0;
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, S);
  ctx.moveTo(0, cy); ctx.lineTo(S, cy);
  ctx.stroke();

  // ── Trail ────────────────────────────────────────────────────────────────
  if (tracing && trail.length > 1) {
    ctx.shadowBlur = 0;
    ctx.lineWidth  = 1.0;
    for (let i = 1; i < trail.length; i++) {
      const alpha = (i / trail.length) * 0.55;
      ctx.strokeStyle = `rgba(74,176,224,${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1][0], trail[i - 1][1]);
      ctx.lineTo(trail[i][0],     trail[i][1]);
      ctx.stroke();
    }
    // Leading point
    const [lx, ly] = trail[trail.length - 1];
    ctx.shadowColor = 'rgba(74,176,224,0.8)';
    ctx.shadowBlur  = 10;
    ctx.fillStyle   = '#a8dcf5';
    ctx.beginPath();
    ctx.arc(lx, ly, 2.5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ── Rotor ────────────────────────────────────────────────────────────────
  ctx.save();
  ctx.translate(cx, cy);
  rotor(d0, 0);
  ctx.restore();

  // Collect trace
  if (tracing) {
    const pt = zeroEndpoint(cx, cy, d0);
    trail.push(pt);
    if (trail.length > TRAIL_CAP) trail.shift();
  }

  // ── HUD update ───────────────────────────────────────────────────────────
  const phase = ((t % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  document.getElementById('h-t').textContent   = t.toFixed(4);
  document.getElementById('h-cyc').textContent = (phase / (2 * Math.PI)).toFixed(4);
  document.getElementById('h-dep').textContent = maxL;
  document.getElementById('h-seg').textContent = segCount(maxL).toLocaleString();

  // Light up formula when tracing
  document.getElementById('formula').classList.toggle('lit', tracing);
}

requestAnimationFrame(frame);

// ── Controls ─────────────────────────────────────────────────────────────────
document.getElementById('r-spd').addEventListener('input', function() {
  omega = +this.value;
  document.getElementById('v-spd').textContent = omega.toFixed(2);
});
document.getElementById('r-dep').addEventListener('input', function() {
  maxL = +this.value;
  document.getElementById('v-dep').textContent = maxL;
  trail = [];
});
document.getElementById('b-pp').addEventListener('click', function() {
  running = !running;
  this.textContent = running ? 'PAUSE' : 'PLAY';
  this.classList.toggle('on', running);
  if (running) prev = null;
});
document.getElementById('b-rst').addEventListener('click', () => { t = 0; trail = []; });
document.getElementById('b-tr').addEventListener('click', function() {
  tracing = !tracing;
  this.classList.toggle('on', tracing);
  if (!tracing) trail = [];
});
</script>
