<title>Two Triangles · GF(37)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Deliberate single dark theme — instrument display */
:root {
  --ground:    #06080f;
  --panel:     #0d1520;
  --border:    #182435;
  --text:      #a8bcc8;
  --dim:       #2e4a5a;
  --A:         #36b4e0;   /* Triangle A — 7s — ORBIT_11 — cyan */
  --B:         #c89030;   /* Triangle B — 6s — IC — amber */
  --seam:      #8090a0;
  --A-glow:    rgba(54,180,224,0.18);
  --B-glow:    rgba(200,144,48,0.18);
  --seam-glow: rgba(128,144,160,0.25);
}

body {
  background: var(--ground);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

canvas { display: block; }

/* ── HUD top-right ────────────────────────────────── */
#hud {
  position: fixed;
  top: 16px;
  right: 18px;
  font-size: 10px;
  line-height: 2.3;
  letter-spacing: 0.07em;
  text-align: right;
  pointer-events: none;
}
.hud-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
.hud-key { color: var(--dim); text-transform: uppercase; font-size: 9px; letter-spacing: 0.14em; }
.hud-val { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.hud-val.a { color: var(--A); }
.hud-val.b { color: var(--B); }
.hud-val.seam { color: var(--seam); }
.hud-val.dim  { color: var(--dim); }

/* ── Big reading ──────────────────────────────────── */
#reading {
  position: fixed;
  top: 16px;
  left: 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.reading-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.digit-str {
  font-size: 32px;
  letter-spacing: 0.1em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.orbit-pill {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 2px 8px;
  border: 1px solid;
  border-radius: 2px;
}
.orbit-IC     { color: var(--B);    border-color: var(--B);    background: rgba(200,144,48,0.1); }
.orbit-O11    { color: var(--A);    border-color: var(--A);    background: rgba(54,180,224,0.1); }
.orbit-SEAM   { color: var(--seam); border-color: var(--seam); background: rgba(128,144,160,0.1); }
.r-mod { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 40px; }

/* ── Controls ─────────────────────────────────────── */
#ctrl {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 22px;
  background: rgba(6,8,15,0.92);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 0.1em;
}
.ctrl-label { color: var(--dim); text-transform: uppercase; }
.ctrl-label.a { color: var(--A); }
.ctrl-label.b { color: var(--B); }
input[type=range] {
  -webkit-appearance: none;
  width: 100px;
  height: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
input[type=range].a::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  background: var(--A); border-radius: 50%;
}
input[type=range].b::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  background: var(--B); border-radius: 50%;
}
.ctrl-val { color: var(--text); min-width: 32px; font-variant-numeric: tabular-nums; font-size: 10px; }
.ctrl-sep { width: 1px; height: 24px; background: var(--border); }

button {
  font-family: inherit;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
button:hover { color: var(--text); border-color: var(--text); }
button.active-a { color: var(--A); border-color: var(--A); }
button.active-b { color: var(--B); border-color: var(--B); }

/* ── Theorem note bottom-left ─────────────────────── */
#theorem {
  position: fixed;
  bottom: 18px;
  left: 18px;
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.08em;
  line-height: 1.9;
  pointer-events: none;
}
</style>

<!-- HUD: orbit readouts -->
<div id="hud">
  <div class="hud-row"><span class="hud-key">δ phase</span><span class="hud-val dim" id="h-phase">0.0°</span></div>
  <div class="hud-row"><span class="hud-key">speed A</span><span class="hud-val a" id="h-sa">1.00×</span></div>
  <div class="hud-row"><span class="hud-key">speed B</span><span class="hud-val b" id="h-sb">0.62×</span></div>
  <div class="hud-row"><span class="hud-key">667+776</span><span class="hud-val dim">≡ 0 mod 37</span></div>
  <div class="hud-row"><span class="hud-key">676+767</span><span class="hud-val dim">≡ 0 mod 37</span></div>
  <div class="hud-row"><span class="hud-key">666</span><span class="hud-val dim">= 37 × 18</span></div>
  <div class="hud-row"><span class="hud-key">777</span><span class="hud-val dim">= 37 × 21</span></div>
</div>

<!-- Reading: top and bottom row 3-digit numbers -->
<div id="reading">
  <div class="reading-row">
    <span class="digit-str" id="r-top">767</span>
    <span class="r-mod" id="r-top-mod">≡27</span>
    <span class="orbit-pill orbit-O11" id="r-top-orb">ORBIT_11</span>
  </div>
  <div class="reading-row">
    <span class="digit-str" id="r-bot">676</span>
    <span class="r-mod" id="r-bot-mod">≡10</span>
    <span class="orbit-pill orbit-IC" id="r-bot-orb">IC</span>
  </div>
</div>

<canvas id="c"></canvas>

<!-- Controls -->
<div id="ctrl">
  <div class="ctrl-group">
    <span class="ctrl-label a">▲ 7</span>
    <input type="range" class="a" id="sa" min="0" max="30" value="10" step="1">
    <span class="ctrl-val" id="sa-v">1.0×</span>
    <button id="dir-a">CW</button>
  </div>
  <div class="ctrl-sep"></div>
  <div class="ctrl-group">
    <span class="ctrl-label b">▲ 6</span>
    <input type="range" class="b" id="sb" min="0" max="30" value="6" step="1">
    <span class="ctrl-val" id="sb-v">0.6×</span>
    <button id="dir-b">CW</button>
  </div>
  <div class="ctrl-sep"></div>
  <button id="btn-pause">PAUSE</button>
</div>

<!-- Theorem note -->
<div id="theorem">
  Theorem 145 · GF(37)<br>
  popcount 0 → SEAM<br>
  popcount 1 → IC = {1, 10, 26}<br>
  popcount 2 → ORBIT_11 = −IC<br>
  popcount 3 → SEAM
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── State ──────────────────────────────────────────
let phaseA = 90;   // Triangle A start angle (degrees): top vertex
let phaseB = 30;   // Triangle B start angle
let speedA = 1.0;  // degrees per frame (×some scale)
let speedB = 0.62;
let dirA = 1;      // +1 = CW, -1 = CCW
let dirB = 1;
let paused = false;
let lastTime = null;

// ── Controls ───────────────────────────────────────
const saSlider = document.getElementById('sa');
const sbSlider = document.getElementById('sb');
const saVal    = document.getElementById('sa-v');
const sbVal    = document.getElementById('sb-v');
const dirABtn  = document.getElementById('dir-a');
const dirBBtn  = document.getElementById('dir-b');
const pauseBtn = document.getElementById('btn-pause');

saSlider.addEventListener('input', () => {
  speedA = saSlider.value / 10;
  saVal.textContent = speedA.toFixed(1) + '×';
  document.getElementById('h-sa').textContent = speedA.toFixed(2) + '×';
});
sbSlider.addEventListener('input', () => {
  speedB = sbSlider.value / 10;
  sbVal.textContent = speedB.toFixed(1) + '×';
  document.getElementById('h-sb').textContent = speedB.toFixed(2) + '×';
});
dirABtn.addEventListener('click', () => {
  dirA *= -1;
  dirABtn.textContent = dirA > 0 ? 'CW' : 'CCW';
});
dirBBtn.addEventListener('click', () => {
  dirB *= -1;
  dirBBtn.textContent = dirB > 0 ? 'CW' : 'CCW';
});
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'PLAY' : 'PAUSE';
  if (!paused) { lastTime = null; requestAnimationFrame(loop); }
});

// ── GF(37) helpers ─────────────────────────────────
const IC11 = { 1: 'IC', 10: 'IC', 26: 'IC', 11: 'ORBIT_11', 27: 'ORBIT_11', 36: 'ORBIT_11' };
function orbitOf(n) {
  const r = ((n % 37) + 37) % 37;
  if (r === 0) return 'SEAM';
  return IC11[r] || '?';
}

function angDiff(a, b) {
  let d = Math.abs(((a - b) % 360 + 360) % 360);
  if (d > 180) d = 360 - d;
  return d;
}

function getDigit(hexAngleDeg, pA, pB) {
  const dA = Math.min(
    angDiff(hexAngleDeg, pA),
    angDiff(hexAngleDeg, pA + 120),
    angDiff(hexAngleDeg, pA + 240)
  );
  const dB = Math.min(
    angDiff(hexAngleDeg, pB),
    angDiff(hexAngleDeg, pB + 120),
    angDiff(hexAngleDeg, pB + 240)
  );
  return dA <= dB ? 7 : 6;
}

// Hex node angles (degrees), 0=top going CW
const HEX = [90, 30, -30, -90, -150, 150];

// ── Draw helpers ───────────────────────────────────
function toXY(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy - r * Math.sin(rad)];
}

function drawTriangle(cx, cy, r, phase, color, glow) {
  ctx.beginPath();
  const angles = [phase, phase + 120, phase + 240];
  for (let i = 0; i < 3; i++) {
    const [x, y] = toXY(cx, cy, r, angles[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = glow;
  ctx.fill();
}

function drawNode(cx, cy, digit, r_ring, angleDeg) {
  const [x, y] = toXY(cx, cy, r_ring, angleDeg);
  const isA = digit === 7;
  const col = isA ? '#36b4e0' : '#c89030';
  const bg  = isA ? 'rgba(54,180,224,0.12)' : 'rgba(200,144,48,0.12)';

  // Node circle
  ctx.beginPath();
  ctx.arc(x, y, 22, 0, 2 * Math.PI);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  ctx.shadowColor = col;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Digit label
  ctx.fillStyle = col;
  ctx.font = 'bold 22px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(digit), x, y);
}

function drawHexRing(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const [x, y] = toXY(cx, cy, r, HEX[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = '#182435';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ── Update HUD ─────────────────────────────────────
function orbitClass(name) {
  if (name === 'IC') return 'orbit-IC';
  if (name === 'ORBIT_11') return 'orbit-O11';
  return 'orbit-SEAM';
}
function digitColor(name) {
  if (name === 'IC') return '#c89030';
  if (name === 'ORBIT_11') return '#36b4e0';
  return '#8090a0';
}

function updateHUD(digits) {
  // Top "row": nodes 5, 0, 1 → hundreds, tens, ones
  const top = digits[5] * 100 + digits[0] * 10 + digits[1];
  const bot = digits[4] * 100 + digits[3] * 10 + digits[2];
  const topR = ((top % 37) + 37) % 37;
  const botR = ((bot % 37) + 37) % 37;
  const topOrb = orbitOf(top);
  const botOrb = orbitOf(bot);

  document.getElementById('r-top').textContent = String(top);
  document.getElementById('r-top').style.color = digitColor(topOrb);
  document.getElementById('r-top-mod').textContent = '≡' + topR;
  const tpill = document.getElementById('r-top-orb');
  tpill.textContent = topOrb;
  tpill.className = 'orbit-pill ' + orbitClass(topOrb);

  document.getElementById('r-bot').textContent = String(bot);
  document.getElementById('r-bot').style.color = digitColor(botOrb);
  document.getElementById('r-bot-mod').textContent = '≡' + botR;
  const bpill = document.getElementById('r-bot-orb');
  bpill.textContent = botOrb;
  bpill.className = 'orbit-pill ' + orbitClass(botOrb);

  const delta = ((phaseA - phaseB) % 360 + 360) % 360;
  document.getElementById('h-phase').textContent = delta.toFixed(1) + '°';
}

// ── Draw ───────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const R_RING = Math.min(W, H) * 0.27;
  const R_TRI  = R_RING;

  // Faint center
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R_RING * 1.4);
  grad.addColorStop(0, 'rgba(24,36,53,0.18)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Hex ring
  drawHexRing(cx, cy, R_RING);

  // Spoke lines
  ctx.strokeStyle = '#0f1e2d';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const [x, y] = toXY(cx, cy, R_RING, HEX[i]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  // Triangle B (6s, amber) — behind
  drawTriangle(cx, cy, R_TRI, phaseB, '#c89030', 'rgba(200,144,48,0.06)');
  // Triangle A (7s, cyan) — in front
  drawTriangle(cx, cy, R_TRI, phaseA, '#36b4e0', 'rgba(54,180,224,0.06)');

  // Compute digits and draw nodes
  const digits = HEX.map(a => getDigit(a, phaseA, phaseB));
  for (let i = 0; i < 6; i++) {
    drawNode(cx, cy, digits[i], R_RING, HEX[i]);
  }

  // Center: show if SEAM state
  const top = digits[5] * 100 + digits[0] * 10 + digits[1];
  if (top % 37 === 0) {
    ctx.fillStyle = 'rgba(128,144,160,0.15)';
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = '#8090a0';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SEAM', cx, cy);
  }

  // Triangle vertex markers
  for (let k = 0; k < 3; k++) {
    const [ax, ay] = toXY(cx, cy, R_TRI, phaseA + k * 120);
    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 2 * Math.PI);
    ctx.fillStyle = '#36b4e0'; ctx.shadowColor = '#36b4e0'; ctx.shadowBlur = 8;
    ctx.fill(); ctx.shadowBlur = 0;

    const [bx, by] = toXY(cx, cy, R_TRI, phaseB + k * 120);
    ctx.beginPath(); ctx.arc(bx, by, 4, 0, 2 * Math.PI);
    ctx.fillStyle = '#c89030'; ctx.shadowColor = '#c89030'; ctx.shadowBlur = 8;
    ctx.fill(); ctx.shadowBlur = 0;
  }

  updateHUD(digits);
}

// ── Loop ───────────────────────────────────────────
const DEG_PER_MS = 0.04; // base speed scale

function loop(ts) {
  if (paused) return;
  if (lastTime === null) lastTime = ts;
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  phaseA = (phaseA + dirA * speedA * DEG_PER_MS * dt) % 360;
  phaseB = (phaseB + dirB * speedB * DEG_PER_MS * dt) % 360;

  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
