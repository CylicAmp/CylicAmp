<title>Chromatic Roots · 3×3 Grid Graph</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #06080e;
  --surface: #0b0e18;
  --border:  #141c2c;
  --amber:   #c8911e;
  --teal:    #28a8b0;
  --text:    #b4b0a4;
  --muted:   #303860;
  --mono: ui-monospace, 'Cascadia Code', 'Courier New', monospace;
  --sans: system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  padding: 1.2rem 1.2rem 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

header { text-align: center; }

.eyebrow {
  font-family: var(--mono);
  font-size: 0.57rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}

h1 {
  font-size: 0.92rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: var(--text);
  margin-top: 0.15rem;
}

.sub {
  font-family: var(--mono);
  font-size: 0.57rem;
  color: var(--muted);
  margin-top: 0.1rem;
}

/* ── Plot ─────────────────────────────────────────── */
.plot-wrap {
  position: relative;
  border: 1px solid var(--border);
  line-height: 0;
  width: 100%;
  max-width: 700px;
}

canvas { display: block; width: 100%; }

.tip {
  position: absolute;
  background: #0b0e18ee;
  border: 1px solid var(--border);
  padding: 0.3rem 0.55rem;
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text);
  pointer-events: none;
  white-space: nowrap;
  display: none;
}

/* ── Below-canvas ─────────────────────────────────── */
.lower {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.85rem;
  width: 100%;
  max-width: 700px;
}

@media (max-width: 480px) {
  .lower { grid-template-columns: 1fr; }
}

.panel {
  border: 1px solid var(--border);
  padding: 0.75rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.panel-label {
  font-size: 0.53rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Legend */
.legend {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.leg-item {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-family: var(--mono);
  font-size: 0.58rem;
}

.leg-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Polynomial */
.poly {
  font-family: var(--mono);
  font-size: 0.58rem;
  color: var(--muted);
  line-height: 1.75;
}

.poly b { color: var(--text); font-weight: 400; }

/* Coefficient table */
.coeff-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 0.57rem;
  font-variant-numeric: tabular-nums;
}

th {
  font-weight: 500;
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 0.4rem 0.4rem;
  text-align: right;
  border-bottom: 1px solid var(--border);
}

th:first-child { text-align: left; }

td {
  padding: 0.22rem 0.4rem;
  text-align: right;
  color: var(--muted);
  border-bottom: 1px solid #0c1018;
}

td:first-child { text-align: left; color: var(--text); }

.badge {
  display: inline-block;
  padding: 0.06em 0.3em;
  border-radius: 2px;
  font-size: 0.5rem;
  letter-spacing: 0.04em;
  vertical-align: middle;
}

.b-ic   { background: rgba(200,145,30,0.14); color: var(--amber); }
.b-seed { background: rgba(40,168,176,0.14); color: var(--teal); }
.b-pr   { color: #485070; }

.star { color: var(--amber); margin-left: 0.15em; font-size: 0.45rem; }
</style>

<header>
  <p class="eyebrow">P(G, z) = 0</p>
  <h1>Chromatic Roots — 3×3 Grid Graph</h1>
  <p class="sub">9 vertices · 12 edges · deg-9 chromatic polynomial · GF(37)</p>
</header>

<div class="plot-wrap" id="wrap">
  <canvas id="c"></canvas>
  <div class="tip" id="tip"></div>
</div>

<div class="lower">
  <div class="panel">
    <p class="panel-label">Root Groups</p>
    <div class="legend" id="leg"></div>
    <p class="poly">
      P(G,k) = <b>k(k−1) · Q(k)</b><br>
      Q(k) = <b>k⁷ − 11k⁶ + 55k⁵<br>
      &nbsp;− 161k⁴ + 298k³<br>
      &nbsp;− 350k² + 244k − 79</b>
    </p>
  </div>

  <div class="panel">
    <p class="panel-label">Q(k) Coefficients mod 37 (signed)</p>
    <div class="coeff-wrap">
      <table>
        <thead>
          <tr>
            <th>Term</th>
            <th>Coeff</th>
            <th>mod 37</th>
            <th>Class</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ── Root data ────────────────────────────────────────────────────
const GROUPS = [
  { re: 0,       im: 0,        pair: false, label: '0',                    color: '#d44040' },
  { re: 1,       im: 0,        pair: false, label: '1',                    color: '#d87828' },
  { re: 1.64604, im: 0,        pair: false, label: '≈ 1.64604',            color: '#b8a818' },
  { re: 1.01131, im: 1.10406,  pair: true,  label: '1.01131 ± 1.10406 i',  color: '#38a858' },
  { re: 1.62947, im: 1.34004,  pair: true,  label: '1.62947 ± 1.34004 i',  color: '#4088d0' },
  { re: 2.03620, im: 0.81492,  pair: true,  label: '2.03620 ± 0.81492 i',  color: '#9058c8' },
];

const ALL_ROOTS = [];
GROUPS.forEach(g => {
  ALL_ROOTS.push({ re: g.re, im: g.im,   color: g.color });
  if (g.pair) ALL_ROOTS.push({ re: g.re, im: -g.im, color: g.color });
});

// ── Canvas ───────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const W = Math.min(700, window.innerWidth - 40);
const H = Math.round(W * 0.56);
canvas.width  = W;
canvas.height = H;

const XMIN = -0.52, XMAX = 2.78;
const YMIN = -1.58, YMAX = 1.58;
const ML = 52, MR = 20, MT = 22, MB = 40;
const PW = W - ML - MR;
const PH = H - MT - MB;

const mx = x => ML + (x - XMIN) / (XMAX - XMIN) * PW;
const my = y => MT + (YMAX - y) / (YMAX - YMIN) * PH;

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#06080e';
  ctx.fillRect(0, 0, W, H);

  // Root-free zone (1, 32/27) — amber tint
  ctx.fillStyle = 'rgba(200,145,30,0.065)';
  ctx.fillRect(mx(1), MT, mx(32/27) - mx(1), PH);

  // Faint grid
  ctx.lineWidth = 0.5;
  ctx.strokeStyle = '#0d1220';
  for (let x = 0; x <= 2.5; x += 0.5) {
    ctx.beginPath(); ctx.moveTo(mx(x), MT); ctx.lineTo(mx(x), MT + PH); ctx.stroke();
  }
  for (let y = -1.5; y <= 1.5; y += 0.5) {
    ctx.beginPath(); ctx.moveTo(ML, my(y)); ctx.lineTo(ML + PW, my(y)); ctx.stroke();
  }

  // Axes
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = '#1c2540';
  ctx.beginPath(); ctx.moveTo(ML, my(0)); ctx.lineTo(ML + PW, my(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx(0), MT); ctx.lineTo(mx(0), MT + PH); ctx.stroke();

  // Threshold line x = 32/27
  ctx.save();
  ctx.setLineDash([3, 5]);
  ctx.lineWidth = 0.9;
  ctx.strokeStyle = 'rgba(200,145,30,0.55)';
  ctx.beginPath(); ctx.moveTo(mx(32/27), MT); ctx.lineTo(mx(32/27), MT + PH); ctx.stroke();
  ctx.restore();

  // Threshold label
  ctx.font = '8px ' + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = 'rgba(200,145,30,0.6)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('32/27', mx(32/27), MT + PH + 4);

  // "root-free" annotation above real axis
  ctx.font = '6.5px system-ui';
  ctx.fillStyle = 'rgba(200,145,30,0.32)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('(1, ³²/₂₇]', (mx(1) + mx(32/27)) / 2, my(0) - 3);

  // x-axis ticks
  ctx.font = '8.5px ui-monospace, monospace';
  ctx.fillStyle = '#283050';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  [0, 0.5, 1.0, 1.5, 2.0, 2.5].forEach(x => {
    ctx.fillText(x === 0 ? '0' : x.toFixed(1), mx(x), MT + PH + 4);
  });

  // y-axis ticks
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  [-1.5, -1, -0.5, 0.5, 1, 1.5].forEach(y => {
    ctx.fillText((y > 0 ? '+' : '') + y.toFixed(1) + 'i', ML - 5, my(y));
  });

  // Axis labels
  ctx.font = '8px system-ui';
  ctx.fillStyle = '#202840';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('Re(z)', ML + PW / 2, H);
  ctx.save();
  ctx.translate(10, MT + PH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Im(z)', 0, 0);
  ctx.restore();

  // Conjugate pair connectors
  GROUPS.filter(g => g.pair).forEach(g => {
    ctx.beginPath();
    ctx.moveTo(mx(g.re), my(g.im));
    ctx.lineTo(mx(g.re), my(-g.im));
    ctx.lineWidth   = 0.5;
    ctx.strokeStyle = g.color + '18';
    ctx.stroke();
  });

  // Root glows + dots
  ALL_ROOTS.forEach(r => {
    const px = mx(r.re), py = my(r.im);

    const grad = ctx.createRadialGradient(px, py, 0, px, py, 20);
    grad.addColorStop(0, r.color + '44');
    grad.addColorStop(1, r.color + '00');
    ctx.beginPath();
    ctx.arc(px, py, 20, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px, py, 4, 0, 2 * Math.PI);
    ctx.fillStyle   = r.color;
    ctx.shadowColor = r.color;
    ctx.shadowBlur  = 9;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

draw();

// ── Legend ────────────────────────────────────────────────────────
const leg = document.getElementById('leg');
GROUPS.forEach(g => {
  const d = document.createElement('div');
  d.className = 'leg-item';
  d.innerHTML = `<div class="leg-dot" style="background:${g.color}"></div>
                 <span style="color:${g.color}bb">${g.label}</span>`;
  leg.appendChild(d);
});

// ── Coefficient table ─────────────────────────────────────────────
const COEFFS = [
  { term: 'k⁷', raw: +1,   m37: 1,  cls: 'IC',         badge: 'ic',   star: false },
  { term: 'k⁶', raw: -11,  m37: 26, cls: 'IC',         badge: 'ic',   star: true  },
  { term: 'k⁵', raw: +55,  m37: 18, cls: 'SEED_ORBIT', badge: 'seed', star: true  },
  { term: 'k⁴', raw: -161, m37: 24, cls: 'CB ∩ SEED',  badge: 'seed', star: true  },
  { term: 'k³', raw: +298, m37: 2,  cls: 'PR',         badge: 'pr',   star: false },
  { term: 'k²', raw: -350, m37: 20, cls: 'PR',         badge: 'pr',   star: false },
  { term: 'k',  raw: +244, m37: 22, cls: 'PR',         badge: 'pr',   star: false },
  { term: '1',  raw: -79,  m37: 32, cls: 'SEED_ORBIT', badge: 'seed', star: true  },
];

const tbody = document.getElementById('tbody');
COEFFS.forEach(c => {
  const tr = document.createElement('tr');
  const sign = c.raw >= 0 ? '+' : '−';
  tr.innerHTML = `
    <td>${c.term}</td>
    <td>${sign}${Math.abs(c.raw)}</td>
    <td>${c.m37}</td>
    <td><span class="badge b-${c.badge}">${c.cls}</span>${c.star ? '<span class="star">★</span>' : ''}</td>
  `;
  tbody.appendChild(tr);
});

// ── Hover tooltip ─────────────────────────────────────────────────
const tip = document.getElementById('tip');

canvas.addEventListener('mousemove', e => {
  const scaleX = W / canvas.offsetWidth;
  const scaleY = H / canvas.offsetHeight;
  const sx = e.offsetX * scaleX;
  const sy = e.offsetY * scaleY;

  let hit = null, best = 22;
  ALL_ROOTS.forEach(r => {
    const d = Math.hypot(mx(r.re) - sx, my(r.im) - sy);
    if (d < best) { best = d; hit = r; }
  });

  if (hit) {
    const im = hit.im === 0 ? '' :
               (hit.im > 0 ? ' + ' : ' − ') + Math.abs(hit.im).toFixed(5) + ' i';
    tip.textContent = hit.re.toFixed(5) + im;
    tip.style.color   = hit.color;
    tip.style.display = 'block';
    tip.style.left    = (e.offsetX + 12) + 'px';
    tip.style.top     = (e.offsetY - 26) + 'px';
  } else {
    tip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
</script>
