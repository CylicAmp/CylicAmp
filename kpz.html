<title>KPZ Interface Growth · GF(37)</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #06080e;
  color: #b0acA0;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  gap: 0.7rem;
}

.header {
  text-align: center;
}

.eyebrow {
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #303858;
}

.title-row {
  margin-top: 0.12rem;
  font-family: ui-monospace, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: #606888;
}

.title-row em { font-style: normal; color: #8898b8; }

/* Canvases */
.canvas-col {
  display: flex;
  flex-direction: column;
  gap: 3px;
  border: 1px solid #0e1220;
}

canvas { display: block; }

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  background: transparent;
  border: 1px solid #1a2030;
  color: #9898a8;
  padding: 0.32rem 0.75rem;
  font-family: ui-monospace, monospace;
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  cursor: pointer;
}
button:hover { border-color: #38405a; }

.sl-group {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: ui-monospace, monospace;
  font-size: 0.54rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #2c3650;
}
.sl-group span { min-width: 2.4em; text-align: right; color: #484c70; }
input[type=range] { accent-color: #3a8ad8; width: 72px; }

/* Annotations row */
.annot {
  display: flex;
  gap: 1.6rem;
  font-family: ui-monospace, monospace;
  font-size: 0.54rem;
  letter-spacing: 0.1em;
  color: #2c3650;
  flex-wrap: wrap;
  justify-content: center;
}
.annot b { font-weight: 500; }
.annot .a { color: #00c8e8aa; }
.annot .b { color: #f8a020aa; }
.annot .c { color: #a060e8aa; }
</style>

<div class="header">
  <p class="eyebrow">Stochastic PDE · KPZ Universality Class</p>
  <p class="title-row">
    ∂<em>h</em>/∂<em>t</em> = ν∇²<em>h</em> + (λ/2)(∇<em>h</em>)² + η(<em>x,t</em>)
  </p>
</div>

<div class="canvas-col" id="wrap"></div>

<div class="controls">
  <button id="rb">RESET</button>
  <label class="sl-group">ν <input type="range" id="nu"  min="0.1" max="2.0" step="0.05" value="0.5"> <span id="nv">0.50</span></label>
  <label class="sl-group">λ <input type="range" id="lam" min="0.0" max="4.0" step="0.1"  value="1.5"> <span id="lv">1.50</span></label>
  <label class="sl-group">σ <input type="range" id="sig" min="0.1" max="2.5" step="0.05" value="1.2"> <span id="sv">1.20</span></label>
</div>

<div class="annot">
  <span class="a"><b>β = 1/3</b> &nbsp;growth exponent &nbsp;W ~ t^β</span>
  <span class="b"><b>z = 3/2</b> &nbsp;dynamical exponent</span>
  <span class="c"><b>ord₃₇(26) = 3</b> &nbsp;·&nbsp; 3-cycle {18,24,32}</span>
</div>

<script>
// ── Layout ────────────────────────────────────────────────────────────────────
const TOTAL_W = Math.min(660, window.innerWidth - 24);
const N       = 256;          // lattice sites
const T_ROWS  = 220;          // rows in space-time plot
const ST_H    = Math.round(TOTAL_W * 0.46);   // space-time canvas height
const PR_H    = Math.round(TOTAL_W * 0.18);   // profile canvas height
const WT_H    = Math.round(TOTAL_W * 0.22);   // W(t) log-log canvas height

const wrap = document.getElementById('wrap');

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  wrap.appendChild(c);
  return c;
}

const stCanvas = mkCanvas(TOTAL_W, ST_H);  // space-time heatmap
const prCanvas = mkCanvas(TOTAL_W, PR_H);  // current profile
const wtCanvas = mkCanvas(TOTAL_W, WT_H);  // W(t) log-log

const stCtx = stCanvas.getContext('2d');
const prCtx = prCanvas.getContext('2d');
const wtCtx = wtCanvas.getContext('2d');

// Offscreen buffer for space-time heatmap
const offCanvas = document.createElement('canvas');
offCanvas.width = N; offCanvas.height = T_ROWS;
const offCtx = offCanvas.getContext('2d');
const stImg  = offCtx.createImageData(N, T_ROWS);

// ── Simulation state ──────────────────────────────────────────────────────────
let h      = new Float64Array(N);
let t_sim  = 0;
let widths = [];              // [log_t, log_W]
const MAX_WIDTHS = 900;

let nu = 0.5, lam = 1.5, sig = 1.2;
const DT = 0.04, STEPS_PER_FRAME = 4;

// ── Color map (centered diverging, dark bg) ───────────────────────────────────
function heightColor(v, range) {
  const t = Math.max(-1, Math.min(1, v / Math.max(range, 0.01)));
  if (t <= 0) {
    const s = -t;
    return [
      Math.round(6   + 24  * s),  //  6 → 30
      Math.round(8   + 72  * s),  //  8 → 80
      Math.round(14  + 186 * s),  // 14 → 200
    ];
  } else {
    const s = t;
    return [
      Math.round(6   + 234 * s),  //  6 → 240
      Math.round(8   + 182 * s),  //  8 → 190
      Math.round(14  - 6   * s),  // 14 → 8
    ];
  }
}

// ── Box-Muller ────────────────────────────────────────────────────────────────
function gauss() {
  return Math.sqrt(-2 * Math.log(1 - Math.random())) *
         Math.cos(2 * Math.PI * Math.random());
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function reset() {
  h.fill(0);
  t_sim = 0;
  widths = [];
  // Fill space-time buffer with background
  const d = stImg.data;
  for (let i = 0; i < d.length; i += 4) {
    d[i]=6; d[i+1]=8; d[i+2]=14; d[i+3]=255;
  }
  offCtx.putImageData(stImg, 0, 0);
}

reset();

// ── One KPZ step ──────────────────────────────────────────────────────────────
function step() {
  const hn  = new Float64Array(N);
  let   sum = 0;
  for (let i = 0; i < N; i++) {
    const ip  = (i + 1) % N;
    const im  = (i - 1 + N) % N;
    const lap = h[ip] + h[im] - 2 * h[i];
    const grd = (h[ip] - h[im]) * 0.5;
    hn[i] = h[i] + nu * lap * DT + 0.5 * lam * grd * grd * DT
              + sig * Math.sqrt(DT) * gauss();
    sum += hn[i];
  }
  const mean = sum / N;
  let   sumSq = 0;
  for (let i = 0; i < N; i++) { h[i] = hn[i] - mean; sumSq += h[i] * h[i]; }

  t_sim += DT;

  // Track interface width W = sqrt(<h²>)
  const W = Math.sqrt(sumSq / N);
  if (t_sim > 0.1 && W > 1e-6) {
    widths.push([Math.log(t_sim), Math.log(W)]);
    if (widths.length > MAX_WIDTHS) widths.shift();
  }

  // Sanity guard
  for (let i = 0; i < N; i++) {
    if (!isFinite(h[i]) || Math.abs(h[i]) > 1e5) { reset(); return; }
  }

  // Scroll space-time buffer: newest row goes to the top
  // (shift existing rows down 1, write row 0)
  const imgData = stImg.data;
  const rowBytes = N * 4;
  imgData.copyWithin(rowBytes, 0, (T_ROWS - 1) * rowBytes);

  const range = Math.max(1, 2.5 * Math.sqrt(t_sim));
  for (let x = 0; x < N; x++) {
    const idx = x * 4;
    const [r, g, b] = heightColor(h[x], range);
    imgData[idx] = r; imgData[idx+1] = g; imgData[idx+2] = b; imgData[idx+3] = 255;
  }
  offCtx.putImageData(stImg, 0, 0);
}

// ── Draw space-time heatmap ───────────────────────────────────────────────────
function drawSpaceTime() {
  stCtx.fillStyle = '#06080e';
  stCtx.fillRect(0, 0, TOTAL_W, ST_H);
  stCtx.drawImage(offCanvas, 0, 0, TOTAL_W, ST_H);

  // Axis labels
  stCtx.font = '7px ui-monospace, monospace';
  stCtx.fillStyle = '#202840';
  stCtx.textAlign = 'left';
  stCtx.textBaseline = 'top';
  stCtx.fillText('x →', 5, 5);
  stCtx.textAlign = 'left'; stCtx.textBaseline = 'bottom';
  stCtx.fillText('t ↑ (current)', 5, ST_H - 4);

  // Right-side W label
  stCtx.textAlign = 'right';
  stCtx.textBaseline = 'top';
  stCtx.fillStyle = '#1c2840';
  stCtx.fillText(`t = ${t_sim.toFixed(1)}`, TOTAL_W - 5, 5);
}

// ── Draw current height profile ───────────────────────────────────────────────
function drawProfile() {
  const ctx = prCtx;
  ctx.fillStyle = '#06080e';
  ctx.fillRect(0, 0, TOTAL_W, PR_H);

  const ML = 38, MR = 8, MT = 8, MB = 20;
  const PW = TOTAL_W - ML - MR;
  const PH = PR_H - MT - MB;

  // Baseline
  const baseLine = MT + PH * 0.5;
  const range = Math.max(1, 2.5 * Math.sqrt(t_sim));

  // Grid line at baseline
  ctx.beginPath();
  ctx.moveTo(ML, baseLine);
  ctx.lineTo(ML + PW, baseLine);
  ctx.strokeStyle = '#0e1422';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Fill curve
  const xs = (i) => ML + (i / (N - 1)) * PW;
  const ys = (v) => baseLine - (v / range) * (PH * 0.45);

  ctx.beginPath();
  ctx.moveTo(xs(0), baseLine);
  for (let i = 0; i < N; i++) ctx.lineTo(xs(i), ys(h[i]));
  ctx.lineTo(xs(N - 1), baseLine);
  ctx.closePath();

  // Gradient fill
  const grad = ctx.createLinearGradient(0, MT, 0, MT + PH);
  grad.addColorStop(0,   'rgba(240,180,8,0.35)');
  grad.addColorStop(0.5, 'rgba(0,200,230,0.10)');
  grad.addColorStop(1,   'rgba(30,80,200,0.30)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Stroke curve
  ctx.beginPath();
  ctx.moveTo(xs(0), ys(h[0]));
  for (let i = 1; i < N; i++) ctx.lineTo(xs(i), ys(h[i]));
  ctx.strokeStyle = 'rgba(0,210,240,0.75)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Axis labels
  ctx.font = '7px ui-monospace, monospace';
  ctx.fillStyle = '#1c2840';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('h(x, t)', 2, baseLine);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#28304a';
  ctx.fillText(`W = ${Math.sqrt(h.reduce((s,v)=>s+v*v,0)/N).toFixed(3)}`, TOTAL_W - MR, baseLine);
}

// ── Draw W(t) log-log plot ────────────────────────────────────────────────────
function drawWidthPlot() {
  const ctx = wtCtx;
  ctx.fillStyle = '#06080e';
  ctx.fillRect(0, 0, TOTAL_W, WT_H);

  if (widths.length < 4) return;

  const ML = 44, MR = 14, MT = 10, MB = 24;
  const PW = TOTAL_W - ML - MR;
  const PH = WT_H - MT - MB;

  // Data range
  let lx0 = widths[0][0], lx1 = widths[widths.length - 1][0];
  let ly0 = Infinity, ly1 = -Infinity;
  widths.forEach(([, ly]) => { if (ly < ly0) ly0 = ly; if (ly > ly1) ly1 = ly; });
  const xrange = Math.max(lx1 - lx0, 0.5);
  const yrange = Math.max(ly1 - ly0, 0.5);
  ly0 -= yrange * 0.12; ly1 += yrange * 0.12;

  const px = lx => ML + (lx - lx0) / xrange * PW;
  const py = ly => MT + PH - (ly - (ly0)) / (ly1 - ly0) * PH;

  // Faint grid
  ctx.strokeStyle = '#0a0e1a';
  ctx.lineWidth = 0.5;
  for (let k = 0; k <= 4; k++) {
    const yy = MT + k * PH / 4;
    ctx.beginPath(); ctx.moveTo(ML, yy); ctx.lineTo(ML + PW, yy); ctx.stroke();
  }
  for (let k = 0; k <= 4; k++) {
    const xx = ML + k * PW / 4;
    ctx.beginPath(); ctx.moveTo(xx, MT); ctx.lineTo(xx, MT + PH); ctx.stroke();
  }

  // Reference slope 1/3 line through midpoint of data
  const midX = (lx0 + lx1) / 2;
  const midW = widths[Math.floor(widths.length / 2)][1];
  const refLen = xrange * 0.8;
  const refX0 = midX - refLen / 2, refX1 = midX + refLen / 2;
  const refY0 = midW - (1/3) * refLen / 2, refY1 = midW + (1/3) * refLen / 2;

  ctx.save();
  ctx.setLineDash([4, 7]);
  ctx.beginPath();
  ctx.moveTo(px(refX0), py(refY0));
  ctx.lineTo(px(refX1), py(refY1));
  ctx.strokeStyle = 'rgba(200,145,30,0.4)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();

  // W(t) curve
  ctx.beginPath();
  ctx.moveTo(px(widths[0][0]), py(widths[0][1]));
  for (let i = 1; i < widths.length; i++) ctx.lineTo(px(widths[i][0]), py(widths[i][1]));
  ctx.strokeStyle = 'rgba(160,190,255,0.7)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // Axes
  ctx.strokeStyle = '#141c2c';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(ML, MT); ctx.lineTo(ML, MT + PH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ML, MT + PH); ctx.lineTo(ML + PW, MT + PH); ctx.stroke();

  // Labels
  ctx.font = '7px ui-monospace, monospace';
  ctx.fillStyle = '#1c2840';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('log t', ML + PW / 2, MT + PH + 4);
  ctx.save();
  ctx.translate(9, MT + PH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('log W', 0, 0);
  ctx.restore();

  // Slope annotation
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(200,145,30,0.55)';
  ctx.fillText('slope 1/3', ML + PW - 4, MT + 4);
}

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('rb').addEventListener('click', reset);

function bindSlider(id, valId, setter) {
  const el = document.getElementById(id);
  const vl = document.getElementById(valId);
  el.addEventListener('input', () => { setter(+el.value); vl.textContent = (+el.value).toFixed(2); });
}

bindSlider('nu',  'nv', v => { nu  = v; });
bindSlider('lam', 'lv', v => { lam = v; });
bindSlider('sig', 'sv', v => { sig = v; });

// ── Animation loop ────────────────────────────────────────────────────────────
function tick() {
  for (let s = 0; s < STEPS_PER_FRAME; s++) step();
  drawSpaceTime();
  drawProfile();
  drawWidthPlot();
  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
